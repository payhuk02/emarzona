# Backup only — pg_cron `order-fulfillment-monitor` runs */5.
# Schedule disabled to stop Disk IO Budget burn from duplicate monitors.
name: Fulfillment monitor cron

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run order fulfillment monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SUPABASE_URL and CRON_SECRET secrets are required."
            exit 1
          fi
          curl -sfS -X POST "${SUPABASE_URL%/}/functions/v1/process-order-fulfillment-monitor" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -d '{}' \
            --max-time 120
